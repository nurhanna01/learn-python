[project]
name = "belajar-langchain"
version = "0.1.0"
description = "belajar langchain"
readme = "README.md"
authors = [
    { name = "Nur Hanna", email = "nurhanna01@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.4.7",
    "langchain-google-genai>=4.4.2",
    "python-dotenv>=1.2.4",
]

[project.scripts]
belajar-langchain = "belajar_langchain:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
